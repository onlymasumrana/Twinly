name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          swift --version

      - name: Build Twinly
        run: make build

      - name: Run Test Suite
        run: make test

      - name: Build Application Bundle (Twinly.app)
        run: make app

      - name: Package DMG (Twinly.dmg)
        run: make dmg

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Twinly-Release
          path: |
            build/Twinly.app
            build/Twinly.dmg
